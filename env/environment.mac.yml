# Φ — Apple-Silicon "cockpit" env (the MacBook that connects to the SO-101).
# Use this to calibrate, teleoperate, record, replay, and run small policies (MPS).
# Heavy training should be OFFLOADED (CUDA box / Explorer HPC / HF Jobs) — a fanless Mac throttles.
#
#   conda env create -f env/environment.mac.yml   (or: make setup)
#   conda activate phi
#
name: phi
channels: [conda-forge]
dependencies:
  - python=3.12
  - ffmpeg            # TorchCodec video decode for LeRobotDataset
  - uv
  - pip
  - pip:
      # LeRobot core + robot workflows + Feetech motors (SO-100/101).
      # Pinned to the version verified on the Φ cockpit (Apple M4 / macOS 26, 2026-07-27):
      #   Python 3.12.13 · torch 2.11.0 (MPS) · torchcodec 0.11.1. Keep mac + cuda on the SAME version.
      # See docs/robots/so-arm101/02-setup.md for the exact install and why these extras.
      # `training` is included so smoke tests / benchmarks / small runs work on the
      # cockpit (lerobot-train hard-requires `accelerate`). Real runs still belong on
      # a CUDA box — a fanless Mac throttles over multi-hour training.
      - "lerobot[training,feetech,core_scripts]==0.6.0"
      - "wandb"          # training charts (loss, l1, kld, lr, grad norm)
      # add "lerobot[smolvla]==0.6.0" / "lerobot[pi]==0.6.0" / "lerobot[diffusion]==0.6.0" per policy when needed
